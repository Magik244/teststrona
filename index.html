<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>canva</title>
    <style>
        body {
            text-align: center;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        .controls {
            margin: 20px;
        }
        button {
            padding: 5px;
            margin: 0 5px;
            font-size: 16px;
            cursor: pointer;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.2s;
        }

        button:hover {
            border-color: #333;
        }

        button img {
            width: 40px;
            height: 40px;
            display: block;
            object-fit: contain;
        }

        canvas {
            border: 2px solid black;
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="zmienObrazek('1.png')">
            <img src="1.png" alt="Obrazek 1">
        </button>
        <button onclick="zmienObrazek('2.png')">
            <img src="2.png" alt="Obrazek 2">
        </button>
        <button onclick="zmienObrazek('3.png')">
            <img src="3.png" alt="Obrazek 3">
        </button>
    </div>

    <canvas id="canvasRysowania" width="600" height="480"></canvas>

    <script>
        var canvas = document.getElementById('canvasRysowania');
        var ctx = canvas.getContext('2d');
        var rysuj = false;

        var pedzelObrazek = new Image();
        pedzelObrazek.src = '1.png'; 

        var rozmiarObrazka = 40; 

        function zmienObrazek(sciezka) {
            pedzelObrazek.src = sciezka;
        }

        canvas.onmousedown = function(e) {
            rysuj = true;
            rysujNaSiatce(e);
        };

        canvas.onmousemove = function(e) {
            if (rysuj == true) {
                rysujNaSiatce(e);
            }
        };

        canvas.onmouseup = function() {
            rysuj = false;
        };

        canvas.onmouseleave = function() {
            rysuj = false;
        };

        function rysujNaSiatce(e) {
            var x = e.clientX - canvas.offsetLeft;
            var y = e.clientY - canvas.offsetTop;
            
            var siatkaX = Math.floor(x / rozmiarObrazka) * rozmiarObrazka;
            var siatkaY = Math.floor(y / rozmiarObrazka) * rozmiarObrazka;
            
            ctx.drawImage(pedzelObrazek, siatkaX, siatkaY, rozmiarObrazka, rozmiarObrazka);
        }
    </script>
   
</body>
</html>
