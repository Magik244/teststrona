<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: sans-serif;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .color-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #333;
            cursor: pointer;
            outline: none;
        }

        #btn-black { background-color: #000000; }
        #btn-red { background-color: #ff0000; }
        #btn-blue { background-color: #0000ff; }

        canvas {
            border: 2px solid #333;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="color-btn" id="btn-black"></button>
        <button class="color-btn" id="btn-red"></button>
        <button class="color-btn" id="btn-blue"></button>
    </div>

    <canvas id="canvasRysowania" width="150" height="150"></canvas>

    <script>
        const canvas = document.getElementById('canvasRysowania');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        document.getElementById('btn-black').addEventListener('click', () => ctx.strokeStyle = '#000000');
        document.getElementById('btn-red').addEventListener('click', () => ctx.strokeStyle = '#ff0000');
        document.getElementById('btn-blue').addEventListener('click', () => ctx.strokeStyle = '#0000ff');

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
    </script>

</body>
</html>
